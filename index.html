<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

/* Layout: gradient banner + 4 tab pages (overview / quantitative+compare / qualitative / per hospital). MOPH palette: pink, white, green, blue. */
:root{
  --pink:#E8407E; --pink-d:#C42A63; --pink-soft:#FFE3EE;
  --green:#1FAE6B; --green-d:#0E8A50; --green-soft:#DDF6E8;
  --blue:#1E88E5; --blue-d:#1463B0; --blue-soft:#DCEEFF;
  --ink:#16324F; --muted:#5B7089; --line:#E3ECF5; --bg:#F3F9FF; --card:#FFFFFF;
  --shadow:0 6px 22px rgba(30,136,229,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#EAF5FF 0,#FFF6FA 420px,#F3F9FF 100%);color:var(--ink);
  font-family:'Prompt','Noto Sans Thai','Sarabun',system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.banner{background:linear-gradient(110deg,var(--pink) 0%,#B04FD0 38%,var(--blue) 70%,var(--green) 100%);color:#fff;position:relative;overflow:hidden}
header.banner .wrap{display:flex;align-items:center;gap:24px;padding-block:26px;flex-wrap:wrap}
header.banner .txt{flex:1 1 420px;min-width:0}
.eyebrow{font-size:13px;letter-spacing:.06em;opacity:.92;font-weight:500}
h1{margin:4px 0 6px;font-size:clamp(22px,3.4vw,36px);line-height:1.25;font-weight:700;text-wrap:balance}
.sub{opacity:.95;font-size:14px;max-width:62ch}
.banner svg.hero{flex:0 0 auto;width:min(300px,70vw);height:auto}
.statusbar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:5px 14px;font-size:13px;backdrop-filter:blur(4px)}
.dot{width:9px;height:9px;border-radius:50%;background:#7CFFB8;box-shadow:0 0 0 0 rgba(124,255,184,.7);animation:pulse 2s infinite}
.dot.off{background:#FFD36B;animation:none}.dot.err{background:#FF9DB9;animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(124,255,184,0)}100%{box-shadow:0 0 0 0 rgba(124,255,184,0)}}
.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:5px 14px;background:#fff;color:var(--blue-d);font-weight:600;font-size:13px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
nav.tabs{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:8px;padding-block:10px;overflow-x:auto}
.tab{font:inherit;flex:0 0 auto;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:8px 18px;border-radius:999px;font-weight:500;white-space:nowrap}
.tab[aria-selected=true]{background:linear-gradient(110deg,var(--pink),var(--blue));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(232,64,126,.3)}
main{padding-block:22px 40px}
h2{font-size:20px;margin:28px 0 12px;display:flex;align-items:center;gap:10px;font-weight:600}
h2::before{content:"";width:6px;height:22px;border-radius:4px;background:linear-gradient(var(--pink),var(--blue))}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:18px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.hero-tile{display:flex;align-items:center;gap:16px;border-radius:20px;padding:20px;color:#fff;box-shadow:var(--shadow);min-width:0}
.hero-tile.b{background:linear-gradient(135deg,#4AA8FF,var(--blue-d))}
.hero-tile.p{background:linear-gradient(135deg,#FF7BA8,var(--pink-d))}
.hero-tile.g{background:linear-gradient(135deg,#46D08E,var(--green-d))}
.hero-tile .ic{flex:0 0 64px;height:64px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.hero-tile .big{font-size:40px;font-weight:700;line-height:1.1}
.hero-tile .lbl{font-size:14px;opacity:.95}
.ind-card{display:flex;flex-direction:column;gap:10px;min-width:0}
.ind-top{display:flex;gap:10px;align-items:flex-start}
.num{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.ind-name{font-size:13.5px;line-height:1.45;color:var(--ink);font-weight:500;min-width:0}
.val{font-size:32px;font-weight:700;line-height:1.1}
.val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.tgt{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--blue-soft);color:var(--blue-d);font-weight:500}
.meter{position:relative;height:10px;border-radius:99px;background:var(--line)}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.meter b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.hosp-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.hosp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;font-size:14px;min-width:0;border:1.5px solid}
.hosp.y{background:var(--green-soft);border-color:#9EE3C0;color:#0B6B3D}
.hosp.n{background:#fff;border-color:var(--pink-soft);color:var(--muted)}
.hosp .mk{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.hosp.y .mk{background:var(--green)}.hosp.n .mk{background:#F5B7CE}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;cursor:pointer;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(30,136,229,.35)}
.sel-title{margin:14px 0 4px;font-size:17px;font-weight:600;line-height:1.5}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.seg button{font:inherit;border:0;background:transparent;padding:6px 14px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed=true]{background:var(--blue-soft);color:var(--blue-d);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(120px,230px) 1fr 64px;gap:10px;align-items:center}
.bar-row .nm{font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.track{position:relative;height:22px;border-radius:8px;background:#EEF4FA}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;min-width:2px}
.track b{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.bar-row .v{font-weight:600;text-align:right;font-size:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.tablewrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
th{background:#F1F8FF;color:var(--ink);font-weight:600;position:sticky;top:0;white-space:normal;min-width:78px;vertical-align:bottom}
th:first-child,td:first-child{position:sticky;left:0;text-align:left;background:#fff;z-index:2;min-width:170px;white-space:normal;font-weight:500}
th:first-child{background:#F1F8FF;z-index:3}
th button{font:inherit;background:none;border:0;cursor:pointer;color:inherit;font-weight:700}
td.ok{background:var(--green-soft);color:#0B6B3D;font-weight:600}
td.no{background:var(--pink-soft);color:var(--pink-d);font-weight:600}
td.na{background:#F4F6F9;color:#9AA9BA}
td.ne{background:var(--blue-soft);color:var(--blue-d);font-weight:600}
select{font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--blue);background:#fff;color:var(--ink);min-width:min(100%,320px);font-weight:500}
.badge-big{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px}
.badge-big.y{background:var(--green);color:#fff}.badge-big.n{background:var(--pink-soft);color:var(--pink-d)}
.cmp{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px dashed var(--line)}
.cmp:last-child{border-bottom:0}
.cmp .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.cmp .meta b{color:var(--ink)}
.track .pv{background:var(--pink);width:10px;height:10px;border-radius:50%;top:6px;bottom:auto;border:2px solid #fff;margin-left:-5px}
.heat{display:inline-block;min-width:52px;padding:3px 8px;border-radius:8px;font-weight:600}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0 30px}
@media (max-width:640px){
  .bar-row{grid-template-columns:1fr 56px}.bar-row .nm{grid-column:1/-1}
  .bar-row .track{grid-column:1}
  .hero-tile .big{font-size:32px}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}html{scroll-behavior:auto}}
</style>
</head>

/* ================= อ่าน CSV และแปลงเป็นข้อมูล Dashboard ================= */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else q=false } else cur+=c }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cur);cur='' }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(cur);cur='';rows.push(row);row=[] }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
const norm = s => String(s==null?'':s).replace(/\s+/g,' ').trim();
function num(c){
  if(c==null) return NaN;
  const s=String(c).replace(/[,\s%]/g,'');
  return /^-?\d*\.?\d+$/.test(s)?Number(s):NaN;
}
function parseSheet(g){
  // หาคอลัมน์โรงพยาบาลจากหัวตาราง
  let rh=g.findIndex(r=>r.some(c=>norm(c).includes('จังหวัดกาญจนบุรี')));
  let hc0=3,tc=19;
  if(rh>=0){
    hc0=g[rh].findIndex(c=>norm(c).includes('จังหวัดกาญจนบุรี'));
    const t=g[rh].findIndex(c=>norm(c).includes('รวมจังหวัด'));
    if(t>hc0) tc=t; else tc=hc0+16;
  }
  const n=tc-hc0;
  if(n<2||n>60) throw new Error('อ่านหัวตารางโรงพยาบาลไม่ได้');
  const names=[];
  for(let i=0;i<n;i++){
    const nm=rh>=0?norm((g[rh+1]||[])[hc0+i]):'';
    names.push(nm||SNAP.hospitals[i]||('รพ.'+(i+1)));
  }
  const slice=(row,from,len)=>{const o=[];for(let i=0;i<len;i++)o.push(num((row||[])[from+i]));return o};
  const ind={};
  g.forEach((row,r)=>{
    for(let c=0;c<Math.min(hc0,4);c++){
      const m=norm(row[c]).match(/^([1-9])\s*\.\s*\S/);
      if(m&&!ind[m[1]]&&String(row[c]).length>10){
        const k=+m[1];
        const A=g[r],B=g[r+1],F=g[r+2];
        ind[k]={a:slice(A,hc0,n),at:num(A[tc]),b:slice(B,hc0,n),bt:num((B||[])[tc]),f:slice(F,hc0,n),ft:num((F||[])[tc])};
        const pre=row.slice(0,hc0).map(norm).join(' ');
        const t1=pre.match(/(?:ร้อยละ|ระดับ)\s*(\d+(?:\.\d+)?)/), t2=pre.match(/(\d+)\s*ต่อ\s*1,?000/);
        const tg=t1?+t1[1]:(t2?+t2[1]:null);
        if(tg!=null && k!==1 || (k===1&&t1)) ind[k].tgt=tg;
        break;
      }
    }
  });
  if(Object.keys(ind).length<8) throw new Error('ไม่พบตัวชี้วัดครบ (พบ '+Object.keys(ind).length+')');
  if(isNaN(ind[6]?.ft) && ind[6]) ind[6].ft = ind[6].at/ind[6].bt*1000;
  // เชิงคุณภาพ
  const q={};
  const start=Math.max(0,g.findIndex(r=>r.some(c=>norm(c).startsWith('Building'))));
  QROWS.forEach(def=>{
    for(let r=start;r<g.length;r++){
      const lab=[0,1,2].map(i=>norm(g[r][i])).join(' ');
      const first=norm(g[r][0])||norm(g[r][1])||norm(g[r][2]);
      const hit = def.alt ? (first.startsWith('รว')&&lab.includes(def.alt))
                          : (first.startsWith(def.p)||(def.total&&lab.startsWith(def.p)));
      if(hit){
        const v=slice(g[r],hc0,n);
        if(v.some(x=>!isNaN(x))){ q[def.k]={v,t:num(g[r][tc])}; break; }
      }
    }
  });
  if(Object.keys(q).length<6) throw new Error('ไม่พบตารางเชิงคุณภาพครบ');
  return {hospitals:names,ind,q};
}
window.__parse={parseCSV,parseSheet};

function sheetUrl(){
  let u=`https://docs.google.com/spreadsheets/d/${CFG.SHEET_ID}/gviz/tq?tqx=out:csv`;
  if(CFG.GID) u+=`&gid=${encodeURIComponent(CFG.GID)}`;

function setStatus(kind,msg){
  $('dot').className='dot'+(kind==='live'?'':kind==='err'?' err':' off');
  $('stxt').textContent=msg;
}
async function load(){
  try{
    const r=await fetch(sheetUrl(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const t=await r.text();
    if(t.trim().startsWith('<')) throw new Error('ชีตยังไม่เปิดสิทธิ์ "ทุกคนที่มีลิงก์ดูได้"');
    const d=parseSheet(parseCSV(t));
    mode='live'; lastOk=new Date();
    const key=JSON.stringify(d);
    if(key!==lastKey){ lastKey=key; DATA=d; render(); }
    setStatus('live','เชื่อมต่อ Google Sheet แล้ว · อัปเดตล่าสุด '+lastOk.toLocaleTimeString('th-TH'));
  }catch(e){
    if(mode==='live') setStatus('err','เชื่อมต่อไม่ได้ชั่วคราว แสดงข้อมูลล่าสุดที่ดึงได้ · '+e.message);

  }
}

function meter(i,v){
  const max=Math.max(100,i.type==='rate'?0:100), t=tgtOf(i);
  if(i.type==='score'){ const w=Math.min(100,v/5*100); return `<div class="meter"><i style="width:${w}%;background:${ncol(i)}"></i><b style="left:${t/5*100}%"></b></div>`}

}

function heat(v){

}
function radar(items){
  const cx=210,cy=165,R=100,n=items.length;
  const pt=(k,r)=>{const a=-Math.PI/2+2*Math.PI*k/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  let g='';
  [25,50,75,100].forEach(p=>{g+=`<polygon points="${items.map((_,k)=>pt(k,R*p/100).join(',')).join(' ')}" fill="none" stroke="#D8E6F3" stroke-width="1"/>`});
  items.forEach((_,k)=>{const [x,y]=pt(k,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#D8E6F3"/>`});
  const poly=items.map((it,k)=>pt(k,R*Math.max(0,it.v||0)/100).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="rgba(232,64,126,.25)" stroke="#E8407E" stroke-width="2.5"/>`;
  items.forEach((it,k)=>{
    const [x,y]=pt(k,R*Math.max(0,it.v||0)/100);g+=`<circle cx="${x}" cy="${y}" r="4" fill="#E8407E" stroke="#fff" stroke-width="2"/>`;
    const [lx,ly]=pt(k,R+16);const anc=lx<cx-6?'end':lx>cx+6?'start':'middle';
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="11" fill="#16324F" font-family="Prompt,sans-serif">${esc(it.s)}</text><text x="${lx}" y="${ly+13}" text-anchor="${anc}" font-size="11" font-weight="700" fill="#E8407E" font-family="Prompt,sans-serif">${isNaN(it.v)?'–':it.v.toFixed(1)}</text>`;
  });
  return `<svg viewBox="-60 0 540 330" style="width:100%;max-width:620px;height:auto" role="img" aria-label="กราฟใยแมงมุมคะแนนเชิงคุณภาพ">${g}</svg>`;
}
function vQuality(){
  const q=DATA.q, hs=DATA.hospitals;
  const ax=QROWS.filter(r=>!r.total&&q[r.k]).map(r=>({s:r.short,v:q[r.k].t}));
  const totals=QROWS.filter(r=>r.total&&q[r.k]);
  const tiles=totals.map((r,k)=>`<div class="hero-tile ${['b','p','g'][k]}"><div class="ic">${ring(q[r.k].t)}</div><div><div class="big">${isNaN(q[r.k].t)?'–':q[r.k].t.toFixed(2)}</div><div class="lbl">คะแนนเฉลี่ยเชิงคุณภาพ ${GROUPS[r.g]}</div></div></div>`).join('');
  const cols=QROWS.filter(r=>q[r.k]);
  const head=cols.map(r=>`<th ${r.total?'style="background:#E4F1FF"':''}>${esc(r.short)}<div style="font-weight:400;font-size:11px;color:var(--muted)">${r.total?'':GROUPS[r.g]}</div></th>`).join('');
  const trs=hs.map((h,k)=>`<tr><td>${esc(h)}</td>`+cols.map(r=>`<td>${heat(q[r.k].v[k])}</td>`).join('')+`</tr>`).join('');
  const avg=`<tr><td style="font-weight:700">ค่าเฉลี่ยจังหวัด</td>`+cols.map(r=>`<td>${heat(q[r.k].t)}</td>`).join('')+`</tr>`;
  return `<div class="grid g3">${tiles}</div>
   <h2>คะแนนเชิงคุณภาพเฉลี่ยรายประเด็น</h2>
   <div class="card" style="display:grid;place-items:center">${radar(ax)}</div>
   <h2>คะแนนเชิงคุณภาพรายโรงพยาบาล</h2>
   <div class="card"><div class="tablewrap"><table><thead><tr><th>โรงพยาบาล</th>${head}</tr></thead><tbody>${avg}${trs}</tbody></table></div>
   <div class="legend"><span style="--c:#1FAE6B">85 ขึ้นไป</span><span style="--c:#BDEBD3">70–84</span><span style="--c:#CFE6FB">55–69</span><span style="--c:#FFC9DB">ต่ำกว่า 55</span></div></div>`;
}

/* ================= หน้า 4: รายโรงพยาบาลเทียบค่ารวมจังหวัด ================= */
function vHospital(){
  const hs=DATA.hospitals, k=Math.min(state.hosp,hs.length-1);
  const opts=hs.map((h,j)=>`<option value="${j}" ${j===k?'selected':''}>${esc(h)}</option>`).join('');
  const yes=hasHW(k);
  const rows=IND.map(i=>{
    const h=hv(i,k), p=pv(i), t=tgtOf(i);
    let bar,meta;
    if(i.type==='bin'){
      bar=`<span class="badge-big ${yes?'y':'n'}">${yes?'✓ ให้บริการ '+HW:'ยังไม่ให้บริการ '+HW}</span>`;
      meta=`<span>ภาพรวมจังหวัด: <b>${DATA.ind[9].at} จาก ${DATA.ind[9].bt} แห่ง (${p.toFixed(2)}%)</b></span><span>${tgtText(i)}</span>`;
    }else if(i.type==='rate'){
      bar=`<div class="empty" style="padding:6px 0;text-align:left">ไม่มีข้อมูลรายโรงพยาบาล</div>`;
      meta=`<span>ภาพรวมจังหวัด: <b>${p.toFixed(2)} ต่อ 1,000 ประชากร</b></span><span>${tgtText(i)}</span>`;
    }else if(i.type==='score'){
      bar=`<div class="empty" style="padding:6px 0;text-align:left">สัดส่วนคะแนนถ่วงน้ำหนักของโรงพยาบาลนี้ (A/B): <b style="color:var(--blue)">${fmt(i,h)}</b></div>`;
      meta=`<span>ค่ารวมจังหวัด: <b>${fmt(i,p)}</b></span><span>${tgtText(i)}</span>`;
    }else{
      const max=Math.max(100,h||0,p||0);
      const st=status(i,h), col=st==='ok'?'var(--green)':st==='no'?'var(--pink)':'var(--blue)';
      bar=`<div class="track"><i style="width:${Math.max(0,h||0)/max*100}%;background:${col}"></i><b style="left:${t/max*100}%"></b><b class="pv" style="left:${Math.min(p,max)/max*100}%" title="ค่ารวมจังหวัด"></b></div>`;
      meta=`<span>โรงพยาบาลนี้: <b style="color:${col}">${fmt(i,h)}</b></span><span>ค่ารวมจังหวัด: <b>${fmt(i,p)}</b></span><span>${tgtText(i)}</span>`;
    }
    return `<div class="cmp"><div class="num" style="background:${ncol(i)}">${i.n}</div><div style="min-width:0"><div class="ind-name" style="margin-bottom:8px">${esc(i.name)}</div>${bar}<div class="meta">${meta}</div></div></div>`;
  }).join('');
  const q=DATA.q;
  const qt=QROWS.filter(r=>r.total&&q[r.k]).map((r,j)=>`<div class="hero-tile ${['b','p','g'][j]}"><div class="ic">${ring(q[r.k].v[k])}</div><div><div class="big">${isNaN(q[r.k].v[k])?'–':q[r.k].v[k].toFixed(2)}</div><div class="lbl">คะแนนเชิงคุณภาพ ${GROUPS[r.g]} <span style="opacity:.85">(ค่ารวมจังหวัด ${q[r.k].t.toFixed(2)})</span></div></div></div>`).join('');
  return `<div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
     <label for="hsel" style="font-weight:600">เลือกโรงพยาบาล</label><select id="hsel">${opts}</select>
     <span class="badge-big ${yes?'y':'n'}">${yes?'✓':'–'} ${HW}: ${yes?'ให้บริการ':'ยังไม่ให้บริการ'}</span></div>
   <h2>เทียบกับค่ารวมจังหวัด: ตัวชี้วัดเชิงปริมาณ</h2>
   <div class="card">${rows}<div class="legend"><span style="--c:var(--pink)">จุดชมพู = ค่ารวมจังหวัด</span><span style="--c:var(--ink)">เส้นดำ = เป้าหมาย</span></div></div>
   <h2>คะแนนเชิงคุณภาพ</h2><div class="grid g3">${qt}</div>`;
}

/* ================= ควบคุมหน้าและแท็บ ================= */
const TABS=[['overview','ผลการดำเนินงานภาพรวม',vOverview],['quant','ตัวชี้วัดเชิงปริมาณและเปรียบเทียบรายโรงพยาบาล',vQuant],['quality','เชิงคุณภาพ',vQuality],['hospital','รายโรงพยาบาลเทียบค่ารวมจังหวัด',vHospital]];
function render(){
  $('tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" type="button" data-tab="${t[0]}" aria-selected="${t[0]===state.tab}">${t[1]}</button>`).join('');
  const t=TABS.find(x=>x[0]===state.tab)||TABS[0];
  try{ $('view').innerHTML=t[2](); }catch(e){ $('view').innerHTML='<div class="card empty">แสดงผลไม่ได้: '+esc(e.message)+'</div>'; console.error(e) }
  $('foot').textContent='ข้อมูลเชื่อมต่อจาก Google Sheet “รายงานข้อมูล PC dashboard” · ดึงข้อมูลซ้ำอัตโนมัติทุก '+CFG.REFRESH_SEC+' วินาที';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tab],[data-ind],[data-sort]'); if(!b) return;
  if(b.dataset.tab){state.tab=b.dataset.tab;history.replaceState(null,'','#'+state.tab);scrollTo({top:0})}
  if(b.dataset.ind){state.ind=+b.dataset.ind}
  if(b.dataset.sort){state.sort=b.dataset.sort}
  render();
});
document.addEventListener('change',e=>{ if(e.target.id==='hsel'){state.hosp=+e.target.value;render();document.getElementById('hsel').focus()} });
$('refresh').addEventListener('click',load);
const h0=location.hash.slice(1); if(TABS.some(t=>t[0]===h0)) state.tab=h0;
lastKey='snap'; render();
load();
setInterval(()=>{ if(!document.hidden) load(); },CFG.REFRESH_SEC*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
</script>
</body>
